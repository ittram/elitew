<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Wellness — Landing Page Drafts</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }
  nav {
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    background: #111;
    border-bottom: 1px solid #333;
    flex-shrink: 0;
    /* one row that scrolls sideways on small screens instead of widening the page */
    overflow-x: auto;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  nav::-webkit-scrollbar { display: none; }
  nav button, nav a.open-link { flex: 0 0 auto; white-space: nowrap; }
  @media (max-width: 600px) {
    nav { gap: 6px; padding: 8px 10px; }
    nav button { padding: 6px 12px; font-size: 13px; }
  }
  nav button {
    appearance: none;
    border: 1px solid #444;
    background: #1c1c1c;
    color: #eee;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  nav button:hover { background: #2a2a2a; }
  nav button.active {
    background: #eee;
    color: #111;
    border-color: #eee;
    font-weight: 600;
  }
  nav a.open-link {
    margin-left: auto;
    align-self: center;
    color: #9ad;
    font-size: 13px;
    text-decoration: none;
  }
  nav a.open-link:hover { text-decoration: underline; }
  iframe {
    flex: 1;
    min-height: 0;
    width: 100%;
    border: none;
  }
</style>
</head>
<body>

<nav>
  <button class="active" data-src="elite-wellness-landing_1.html">Draft 1</button>
  <button data-src="elite-wellness-landing_1-1.html">Draft 1.1</button>
  <button data-src="elite-wellness-landing_1-2.html">Draft 1.2</button>
  <button data-src="elite-wellness-landing_1-3.html">Draft 1.3</button>
  <button data-src="elite-wellness-landing_1-4.html">Draft 1.4</button>
  <button data-src="elite-wellness-landing_1-5.html">Draft 1.5</button>
  <button data-src="elite-wellness-landing_1-6.html">Draft 1.6</button>
  <button data-src="elite-wellness-landing_2.html">Draft 2</button>
  <a class="open-link" id="openLink" href="elite-wellness-landing_1.html" target="_blank" rel="noopener">Open in new tab ↗</a>
</nav>

<iframe id="viewer" src="elite-wellness-landing_1.html" title="Landing page preview"></iframe>

<script>
  const buttons = document.querySelectorAll('nav button');
  const viewer = document.getElementById('viewer');
  const openLink = document.getElementById('openLink');

  const gridParam = new URLSearchParams(location.search).get('grid') === '1' ? '?grid=1' : '';
  const withGrid = src => src + gridParam;
  viewer.src = withGrid(viewer.getAttribute('src'));
  openLink.href = withGrid(openLink.getAttribute('href'));

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const src = btn.dataset.src;
      btn.scrollIntoView({ inline: 'nearest', block: 'nearest', behavior: 'smooth' });
      viewer.src = withGrid(src);
      openLink.href = withGrid(src);
    });
  });
</script>

</body>
</html>
