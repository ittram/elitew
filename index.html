<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Wellness | Landing page drafts</title>
<style>
  :root { color-scheme: dark; --bg:#111; --line:#333; --chip:#1c1c1c; --chip-line:#444; --text:#eee; --muted:#9a9a9a; --volt:#D4F04A; --link:#9ad; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; background:var(--bg); color:var(--text); }

  /* one line, always: chips scroll sideways, tools stay pinned on the right */
  .bar { position:relative; z-index:10; display:flex; align-items:center; gap:8px; padding:8px 10px 8px 14px; background:var(--bg); border-bottom:1px solid var(--line); flex-shrink:0; white-space:nowrap; }
  .chips { display:flex; gap:8px; overflow-x:auto; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; scrollbar-width:none; flex:1 1 auto; min-width:0; mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent); -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent); padding-right:24px; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; appearance:none; border:1px solid var(--chip-line); background:var(--chip); color:var(--text); padding:7px 14px; border-radius:6px; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:background .15s,border-color .15s; }
  .chip b { font-weight:700; }
  .chip span { color:var(--muted); }
  .chip:hover { background:#2a2a2a; }
  .chip.active { background:var(--text); color:#111; border-color:var(--text); }
  .chip.active span { color:#555; }
  .chip .dot { width:8px; height:8px; border-radius:50%; background:var(--volt); flex:0 0 auto; }

  .tools { display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .tool { appearance:none; border:1px solid var(--chip-line); background:var(--chip); color:var(--text); height:34px; min-width:34px; padding:0 10px; border-radius:6px; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; }
  .tool:hover, .tool[aria-expanded="true"] { background:#2a2a2a; border-color:#666; }
  .tool.on { border-color:var(--volt); } /* an archived draft is showing */
  .tool .count { background:#333; color:var(--text); border-radius:999px; padding:1px 7px; font-size:12px; }
  .tool svg { width:16px; height:16px; }

  /* panels drop down over the preview, so the bar itself never grows */
  .panel { position:absolute; top:calc(100% + 6px); right:10px; width:min(440px, calc(100vw - 20px)); background:#181818; border:1px solid #3a3a3a; border-radius:10px; box-shadow:0 12px 40px rgba(0,0,0,.5); padding:16px; white-space:normal; display:none; max-height:calc(100dvh - 70px);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .panel.open { display:block; }
  .panel h2 { margin:0 0 4px; font-size:16px; }
  .meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 12px; font-size:12px; color:var(--muted); }
  .status { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; background:#2a2a2a; color:var(--text); }
  .status.latest { background:var(--volt); color:#111; }
  .status.open { background:#2B3EAA; color:#fff; }
  .panel p { margin:0 0 8px; font-size:14px; line-height:1.5; color:#ddd; }
  .panel .label { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:12px 0 4px; }
  .arch { list-style:none; margin:8px 0 0; padding:0; }
  .arch li { border-top:1px solid #2c2c2c; }
  .arch button { width:100%; text-align:left; appearance:none; border:0; background:none; color:var(--text); padding:10px 4px; cursor:pointer; font-size:14px; display:grid; grid-template-columns:48px 1fr; column-gap:8px; }
  .arch button:hover, .arch button.active { background:#222; }
  .arch .v { font-weight:700; }
  .arch .why { grid-column:2; color:var(--muted); font-size:12px; line-height:1.4; margin-top:2px; }
  .hint { font-size:12px; color:var(--muted); margin-top:12px; }

  @media (max-width:600px){
    .bar { gap:6px; padding:6px 8px 6px 10px; }
    .chips { gap:6px; }
    .chip { padding:6px 10px; font-size:13px; }
    .tool { height:32px; min-width:32px; padding:0 8px; }
    .tool .txt { display:none; }
  }
  iframe { flex:1; min-height:0; width:100%; border:none; background:#fff; }
</style>
</head>

</div>

/* newest version first, whatever order the list above is written in */
const vnum = v => v.split('.').map(Number);
const cmpv = (A, B) => { for (let i = 0; i < Math.max(A.length, B.length); i++) { const x = A[i] || 0, y = B[i] || 0; if (x !== y) return x - y; } return 0; };
DRAFTS.sort((a, b) => cmpv(vnum(b.v), vnum(a.v)));

/* Where a draft's work lives. The bar opens the draft at that section. */
const SECTIONS = { '#top':'the top', '#gym':'the gym', '#classes':'the classes', '#prices':'the prices', '#reviews':'the reviews', '#find-us':'hours and location', '#faq':'good to know', '#footer':'the footer' };

const chips = document.getElementById('chips');
const viewer = document.getElementById('viewer');
const openLink = document.getElementById('openLink');
const infoPanel = document.getElementById('infoPanel');
const archBtn = document.getElementById('archBtn'), archPanel = document.getElementById('archPanel');
const grid = new URLSearchParams(location.search).get('grid') === '1' ? '?grid=1' : '';
const live = DRAFTS.filter(d => !d.archived), archived = DRAFTS.filter(d => d.archived);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let current = null;

live.forEach(d => {
  const b = document.createElement('button');
  b.className = 'chip'; b.setAttribute('role','tab'); b.dataset.v = d.v; b.title = 'Click again to see what this draft tests';
  b.innerHTML = (d.status === 'latest' ? '<i class="dot" aria-hidden="true"></i>' : '') + '<b>' + esc(d.v) + '</b><span>' + esc(d.label) + '</span>';
  b.addEventListener('click', e => { if (current && current.v === d.v) { e.stopPropagation(); toggle(null, infoPanel); } else show(d.v); });
  chips.appendChild(b);
});

function statusTag(d){
  if (d.archived) return '<span class="status">Archived</span>';
  if (d.status === 'latest') return '<span class="status latest">Latest</span>';
  return '<span class="status open">Open decision</span>';
}
function renderInfo(d){
  infoPanel.innerHTML = '<h2>Draft ' + esc(d.v) + ': ' + esc(d.label) + '</h2>' +
    '<div class="meta">' + statusTag(d) + '<span>' + esc(d.date) + '</span>' + (SECTIONS[d.at] ? '<span>Opens at ' + esc(SECTIONS[d.at]) + '</span>' : '') + '</div>' +
    '<div class="label">What we tested</div><p>' + esc(d.tested) + '</p>' +
    (d.next ? '<div class="label">Where it stands</div><p>' + esc(d.next) + '</p>' : '') +
    (d.why ? '<div class="label">Why archived</div><p>' + esc(d.why) + '</p>' : '');
}
function renderArchive(){
  // Newest work first. Add new groups to the top of this list.
  const order = ['Prices', 'Footer', 'Hours, location and footer', 'Full page drafts', 'Headline tests'];
  const names = [...new Set(archived.map(d => d.group || 'Other'))].sort((a, b) => {
    const A = order.indexOf(a), B = order.indexOf(b);
    return (A < 0 ? 99 : A) - (B < 0 ? 99 : B);
  });
  archPanel.innerHTML = '<h2>Archive</h2><div class="meta"><span>Drafts we no longer compare. They still open if you need them.</span></div>' +
    names.map(n => '<div class="label">' + esc(n) + '</div><ul class="arch">' +
      archived.filter(d => (d.group || 'Other') === n).map(d =>
        '<li><button data-v="' + esc(d.v) + '"' + (current && current.v === d.v ? ' class="active"' : '') + '><span class="v">' + esc(d.v) + '</span><span>' + esc(d.label) + '</span><span class="why">' + esc(d.why) + '</span></button></li>').join('') +
      '</ul>').join('');
  archPanel.querySelectorAll('button[data-v]').forEach(b => b.addEventListener('click', () => { show(b.dataset.v); close(); }));
}
function show(v, push = true){
  const d = DRAFTS.find(x => x.v === v) || live[0];
  current = d;
  viewer.src = d.file + grid + (d.at && d.at[0] === '#' ? d.at : '');
  openLink.href = d.file + grid;
  document.title = 'Draft ' + d.v + ': ' + d.label + ' | Elite Wellness';
  chips.querySelectorAll('.chip').forEach(c => {
    const on = c.dataset.v === d.v; c.classList.toggle('active', on); c.setAttribute('aria-selected', on);
    if (on) c.scrollIntoView({ inline:'nearest', block:'nearest', behavior:'smooth' });
  });
  archBtn.classList.toggle('on', !!d.archived);
  renderInfo(d);
  if (push) history.replaceState(null, '', location.pathname + location.search + '#' + d.v);
}
function toggle(btn, panel){
  const wasOpen = panel.classList.contains('open');
  close();
  if (!wasOpen) { if (panel === archPanel) renderArchive(); panel.classList.add('open'); if (btn) btn.setAttribute('aria-expanded','true'); }
}
function close(){
  [infoPanel, archPanel].forEach(p => p.classList.remove('open'));
  archBtn.setAttribute('aria-expanded','false');
}
archBtn.addEventListener('click', e => { e.stopPropagation(); toggle(archBtn, archPanel); });
[infoPanel, archPanel].forEach(p => p.addEventListener('click', e => e.stopPropagation()));
document.addEventListener('click', close);
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
viewer.addEventListener('load', () => {
  close();
  const at = current && current.at;
  if (!at) return;
  try {
    const w = viewer.contentWindow, doc = w.document, el = doc.querySelector(at);
    if (!el) return;
    const head = doc.querySelector('header');
    const off = head && getComputedStyle(head).position === 'sticky' ? head.getBoundingClientRect().height : 0;
    const go = () => w.scrollTo({ top: el.getBoundingClientRect().top + w.scrollY - off, behavior: 'instant' });
    go();
    /* web fonts and the map land late and move things, so place it again */
    if (doc.fonts && doc.fonts.ready) doc.fonts.ready.then(() => setTimeout(go, 60));
    setTimeout(go, 400);
  } catch (e) { /* file:// keeps us out of the frame; the hash in the src already got us close */ }
});

/* open the draft in the link (#1.7), otherwise the latest */
show(decodeURIComponent(location.hash.slice(1)) || live[0].v, false);
window.addEventListener('hashchange', () => show(decodeURIComponent(location.hash.slice(1)), false));
</script>
