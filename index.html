<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Wellness | Landing page drafts</title>
<style>
  :root { color-scheme: dark; --bg:#111; --line:#333; --chip:#1c1c1c; --chip-line:#444; --text:#eee; --muted:#9a9a9a; --volt:#D4F04A; --link:#9ad; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; height:100vh; height:100dvh; overflow:hidden; background:var(--bg); color:var(--text); }

  /* one line, always: chips scroll sideways, tools stay pinned on the right */
  .bar { position:relative; z-index:10; display:flex; align-items:center; gap:8px; padding:8px 10px 8px 14px; background:var(--bg); border-bottom:1px solid var(--line); flex-shrink:0; white-space:nowrap; }
  .chips { display:flex; gap:8px; overflow-x:auto; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; scrollbar-width:none; flex:1 1 auto; min-width:0; mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent); -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent); padding-right:24px; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; appearance:none; border:1px solid var(--chip-line); background:var(--chip); color:var(--text); padding:7px 14px; border-radius:6px; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:background .15s,border-color .15s; }
  .chip b { font-weight:700; }
  .chip span { color:var(--muted); }
  .chip:hover { background:#2a2a2a; }
  .chip.active { background:var(--text); color:#111; border-color:var(--text); }
  .chip.active span { color:#555; }
  .chip .dot { width:8px; height:8px; border-radius:50%; background:var(--volt); flex:0 0 auto; }

  .tools { display:flex; align-items:center; gap:6px; flex:0 0 auto; }
  .tool { appearance:none; border:1px solid var(--chip-line); background:var(--chip); color:var(--text); height:34px; min-width:34px; padding:0 10px; border-radius:6px; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; text-decoration:none; }
  .tool:hover, .tool[aria-expanded="true"] { background:#2a2a2a; border-color:#666; }
  .tool.on { border-color:var(--volt); } /* an archived draft is showing */
  .tool .count { background:#333; color:var(--text); border-radius:999px; padding:1px 7px; font-size:12px; }
  .tool svg { width:16px; height:16px; }

  /* panels drop down over the preview, so the bar itself never grows */
  .panel { position:absolute; top:calc(100% + 6px); right:10px; width:min(440px, calc(100vw - 20px)); background:#181818; border:1px solid #3a3a3a; border-radius:10px; box-shadow:0 12px 40px rgba(0,0,0,.5); padding:16px; white-space:normal; display:none; }
  .panel.open { display:block; }
  .panel h2 { margin:0 0 4px; font-size:16px; }
  .meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 12px; font-size:12px; color:var(--muted); }
  .status { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; background:#2a2a2a; color:var(--text); }
  .status.latest { background:var(--volt); color:#111; }
  .status.open { background:#2B3EAA; color:#fff; }
  .panel p { margin:0 0 8px; font-size:14px; line-height:1.5; color:#ddd; }
  .panel .label { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:12px 0 4px; }
  .arch { list-style:none; margin:8px 0 0; padding:0; }
  .arch li { border-top:1px solid #2c2c2c; }
  .arch button { width:100%; text-align:left; appearance:none; border:0; background:none; color:var(--text); padding:10px 4px; cursor:pointer; font-size:14px; display:grid; grid-template-columns:48px 1fr; column-gap:8px; }
  .arch button:hover, .arch button.active { background:#222; }
  .arch .v { font-weight:700; }
  .arch .why { grid-column:2; color:var(--muted); font-size:12px; line-height:1.4; margin-top:2px; }
  .hint { font-size:12px; color:var(--muted); margin-top:12px; }

  @media (max-width:600px){
    .bar { gap:6px; padding:6px 8px 6px 10px; }
    .chips { gap:6px; }
    .chip { padding:6px 10px; font-size:13px; }
    .tool { height:32px; min-width:32px; padding:0 8px; }
    .tool .txt { display:none; }
  }
  iframe { flex:1; min-height:0; width:100%; border:none; background:#fff; }
</style>
</head>
<body>

<div class="bar">
  <div class="chips" id="chips" role="tablist" aria-label="Drafts"></div>
  <div class="tools">
    <button class="tool" id="infoBtn" aria-expanded="false" aria-controls="infoPanel" title="What this draft tests">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6.5"/><path d="M8 7.2v4M8 4.6v.1" stroke-linecap="round"/></svg><span class="txt">About</span>
    </button>
    <button class="tool" id="archBtn" aria-expanded="false" aria-controls="archPanel" title="Archived drafts">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="1.8" y="2.5" width="12.4" height="3.2" rx=".8"/><path d="M3 5.7v7.3h10V5.7M6.3 8.4h3.4" stroke-linecap="round"/></svg><span class="txt">Archive</span><span class="count" id="archCount"></span>
    </button>
    <a class="tool" id="openLink" target="_blank" rel="noopener" title="Open this draft in a new tab">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5M12 9.5v4H2.5V4h4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>

  <div class="panel" id="infoPanel" role="dialog" aria-label="About this draft"></div>
  <div class="panel" id="archPanel" role="dialog" aria-label="Archived drafts"></div>
</div>

<iframe id="viewer" title="Landing page preview"></iframe>

<script>
/* All drafts live here. Newest first.
   To archive one, set archived: true and say why. The first draft that is not archived loads by default. */
const DRAFTS = [
  { v:'1.9.6.5', file:'elite-wellness-landing_1-9-6-5.html', label:'Two columns on desktop', date:'22 Sep 2026', status:'latest',
    tested:'Desktop back to two big columns with the map on the right, running to the edge of the screen. The phone layout and all the styling stay as they were, and a Get directions button sits under the address.',
    next:'Contact and footer are done. Next pass: the timetable, classes and prices in the same design language as the gym section.' },
  { v:'1.9.6.4', file:'elite-wellness-landing_1-9-6-4.html', label:'Final polish', date:'22 Sep 2026', status:'open',
    tested:'No highlight on the hours, the live line carries that on its own. No script line under the title. The note reads free parking, cash at reception. The Google Maps link moved onto the map, bottom right, where it belongs.',
    next:'Contact and footer are done. Next pass: the timetable, classes and prices in the same design language as the gym section.' },
  { v:'1.9.6.3', file:'elite-wellness-landing_1-9-6-3.html', label:'8px rhythm, taller map', date:'22 Sep 2026', status:'open',
    tested:'Same centred heading and band padding as the other sections, every space on the 8px grid, the map band taller at 432px, no Volt in the hours (today is marked in white), and the action bar back to real buttons, aligned right and on phones only.',
    next:'Contact and footer direction. Next pass: the timetable, classes and prices in the same design language as the gym section.' },
  { v:'1.9.6.2', file:'elite-wellness-landing_1-9-6-2.html', label:'Map as the strip between',
    date:'22 Sep 2026', status:'open',
    tested:'One blue block instead of a split: title and live status, the hours as four cells across the width with today marked in Volt, then the map full width as the strip that separates hours from address, then the address and the Google link.',
    next:'Compare with 1.9.6.1, where the map is a tall column beside the panel.' },
  { v:'1.9.6.1', file:'elite-wellness-landing_1-9-6-1.html', label:'Hours first, then location', date:'22 Sep 2026', status:'open',
    tested:'The blue panel restructured: title, live status, then the hours, then the location, with the buttons dropped because the footer and the action bar already carry them. The bar shows two short lines with a real day name. The blue pin over the map is gone.',
    next:'Contact and footer direction. Next pass: the timetable, classes and prices in the same design language as the gym section.' },
  { v:'1.9.6', file:'elite-wellness-landing_1-9-6.html', label:'Split with action bar', date:'22 Sep 2026', status:'open',
    tested:'1.9.4 and 1.9.5 combined: the full width blue panel against the map, plus the black action bar that follows you on a phone. On a phone the map comes first, then the panel. The map fades in instead of flashing, and carries our own blue pin.',
    next:'Contact and footer direction. Next pass: the timetable, classes and prices in the same design language as the gym section.' },
  { v:'1.9.1', file:'elite-wellness-landing_1-9-1.html', label:'Map first', date:'22 Sep 2026', status:'open',
    tested:'The map leads the section and the facts sit under it in three plain columns. The footer is a slim strip of links and small print, with no second call to action.',
    next:'One of five contact and footer designs, all built on 1.9. Pick one and it becomes the next draft.' },
  { v:'1.9.2', file:'elite-wellness-landing_1-9-2.html', label:'Gym card', date:'22 Sep 2026', archived:true,
    tested:'Everything on one bordered card: a map strip, the live open now line, the address, the hours and the two buttons. The footer keeps a "Come train" line, underlined in Volt.',
    why:'Dropped.' },
  { v:'1.9.3', file:'elite-wellness-landing_1-9-3.html', label:'Board', date:'22 Sep 2026', archived:true,
    tested:'The contact block is the dark moment of the page, with the hours set as a board in the display font and an inverted map. The footer goes quiet and white.',
    why:'Dropped. Two dark bands close together fight each other.' },
  { v:'1.9.4', file:'elite-wellness-landing_1-9-4.html', label:'Split', date:'22 Sep 2026', status:'open',
    tested:'A full width blue panel of facts against the map, edge to edge. The boldest of the five. The footer is a single thin black line of links.',
    next:'One of five contact and footer designs, all built on 1.9. Pick one and it becomes the next draft.' },
  { v:'1.9.5', file:'elite-wellness-landing_1-9-5.html', label:'Sticky bar', date:'22 Sep 2026', status:'open',
    tested:'The contact block stays plain and the coolness moves to a black action bar that slides up once you are past the hero and steps aside at the footer.',
    next:'One of five contact and footer designs, all built on 1.9. Pick one and it becomes the next draft.' },
  { v:'1.9', file:'elite-wellness-landing_1-9.html', label:'Contact and footer', date:'22 Sep 2026', status:'open',
    tested:'One contact block instead of two: hours, address and the map together, with a live open now line. A real footer: the closing call, the links and the small print, one column on a phone.',
    next:'Next pass: make the timetable, classes and prices sit in the same design language as the gym section. Headline choice (1.2 to 1.6) is still open.' },
  { v:'1.8', file:'elite-wellness-landing_1-8.html', label:'Floor plan', date:'22 Sep 2026', archived:true,
    tested:'The Gym section: a real isometric floor plan drawn from the emergency plan, with a walking route from the entrance and icon markers you can tap. Also the second accent colour, Volt.',
    why:'Kept. Everything from 1.8 is in 1.9.' },
  { v:'1.6', file:'elite-wellness-landing_1-6.html', label:'Best hour, then Lagos', date:'21 Sep 2026', status:'open',
    tested:'Hero headline: THE BEST HOUR / OF YOUR DAY, and the second line rolls to IN LAGOS.',
    next:'Headline experiments 1.2 to 1.6 are built on Draft 1.1, so they do not have the newer menu or floor plan. Pick one and it moves into the latest draft.' },
  { v:'1.5', file:'elite-wellness-landing_1-5.html', label:'Best hour', date:'21 Sep 2026', status:'open',
    tested:'Hero headline: THE BEST HOUR / OF YOUR DAY, letters settle into place.',
    next:'Open decision, see 1.6.' },
  { v:'1.3', file:'elite-wellness-landing_1-3.html', label:'Rolling place', date:'21 Sep 2026', status:'open',
    tested:'Hero headline: TRAIN stays, the place rolls through before landing on IN LAGOS.',
    next:'Open decision, see 1.6.' },
  { v:'1.2.1', file:'elite-wellness-landing_1-2-1.html', label:'Rolling verb, one way', date:'21 Sep 2026', status:'open',
    tested:'Hero headline: the verb rolls, and every word slides the same direction.',
    next:'Open decision, see 1.6.' },
  { v:'1.2', file:'elite-wellness-landing_1-2.html', label:'Rolling verb', date:'21 Sep 2026', status:'open',
    tested:'Hero headline: the verb rolls through before landing on TRAIN.',
    next:'Open decision, see 1.6.' },

  { v:'1.7', file:'elite-wellness-landing_1-7.html', label:'Language button, mobile menu', date:'21 Sep 2026', archived:true,
    tested:'Round PT/EN language button and the full screen mobile menu.', why:'Kept. Everything from 1.7 is in 1.8.' },
  { v:'1.4', file:'elite-wellness-landing_1-4.html', label:'Bilingual flip', date:'21 Sep 2026', archived:true,
    tested:'Hero headline flipping between Portuguese and English.', why:'Dropped.' },
  { v:'1.1', file:'elite-wellness-landing_1-1.html', label:'Slimmer header', date:'21 Sep 2026', archived:true,
    tested:'Slimmer header, rating above the headline, "best value" inside the monthly card.', why:'Kept. It is the base of 1.7 and 1.8.' },
  { v:'1', file:'elite-wellness-landing_1.html', label:'First full draft', date:'21 Sep 2026', archived:true,
    tested:'The first complete page: logo, timetable, prices, reviews, family.', why:'Replaced by 1.1 and later.' },
  { v:'2', file:'elite-wellness-landing_2.html', label:'Early alternative', date:'Aug 2026', archived:true,
    tested:'An early alternative layout.', why:'Not taken forward.' }
];

/* newest version first, whatever order the list above is written in */
const vnum = v => v.split('.').map(Number);
DRAFTS.sort((a, b) => { const A = vnum(a.v), B = vnum(b.v); for (let i = 0; i < Math.max(A.length, B.length); i++) { const x = A[i] || 0, y = B[i] || 0; if (x !== y) return y - x; } return 0; });

const chips = document.getElementById('chips');
const viewer = document.getElementById('viewer');
const openLink = document.getElementById('openLink');
const infoBtn = document.getElementById('infoBtn'), infoPanel = document.getElementById('infoPanel');
const archBtn = document.getElementById('archBtn'), archPanel = document.getElementById('archPanel');
const grid = new URLSearchParams(location.search).get('grid') === '1' ? '?grid=1' : '';
const live = DRAFTS.filter(d => !d.archived), archived = DRAFTS.filter(d => d.archived);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let current = null;

live.forEach(d => {
  const b = document.createElement('button');
  b.className = 'chip'; b.setAttribute('role','tab'); b.dataset.v = d.v;
  b.innerHTML = (d.status === 'latest' ? '<i class="dot" aria-hidden="true"></i>' : '') + '<b>' + esc(d.v) + '</b><span>' + esc(d.label) + '</span>';
  b.addEventListener('click', () => show(d.v));
  chips.appendChild(b);
});
document.getElementById('archCount').textContent = archived.length;

function statusTag(d){
  if (d.archived) return '<span class="status">Archived</span>';
  if (d.status === 'latest') return '<span class="status latest">Latest</span>';
  return '<span class="status open">Open decision</span>';
}
function renderInfo(d){
  infoPanel.innerHTML = '<h2>Draft ' + esc(d.v) + ': ' + esc(d.label) + '</h2>' +
    '<div class="meta">' + statusTag(d) + '<span>' + esc(d.date) + '</span></div>' +
    '<div class="label">What we tested</div><p>' + esc(d.tested) + '</p>' +
    (d.next ? '<div class="label">Where it stands</div><p>' + esc(d.next) + '</p>' : '') +
    (d.why ? '<div class="label">Why archived</div><p>' + esc(d.why) + '</p>' : '');
}
function renderArchive(){
  archPanel.innerHTML = '<h2>Archive</h2><div class="meta"><span>Drafts we no longer compare. They still open if you need them.</span></div>' +
    '<ul class="arch">' + archived.map(d =>
      '<li><button data-v="' + esc(d.v) + '"' + (current && current.v === d.v ? ' class="active"' : '') + '><span class="v">' + esc(d.v) + '</span><span>' + esc(d.label) + '</span><span class="why">' + esc(d.why) + '</span></button></li>').join('') + '</ul>';
  archPanel.querySelectorAll('button[data-v]').forEach(b => b.addEventListener('click', () => { show(b.dataset.v); close(); }));
}
function show(v, push = true){
  const d = DRAFTS.find(x => x.v === v) || live[0];
  current = d;
  viewer.src = d.file + grid;
  openLink.href = d.file + grid;
  document.title = 'Draft ' + d.v + ': ' + d.label + ' | Elite Wellness';
  chips.querySelectorAll('.chip').forEach(c => {
    const on = c.dataset.v === d.v; c.classList.toggle('active', on); c.setAttribute('aria-selected', on);
    if (on) c.scrollIntoView({ inline:'nearest', block:'nearest', behavior:'smooth' });
  });
  archBtn.classList.toggle('on', !!d.archived);
  renderInfo(d);
  if (push) history.replaceState(null, '', location.pathname + location.search + '#' + d.v);
}
function toggle(btn, panel){
  const open = !panel.classList.contains('open');
  close();
  if (open) { if (panel === archPanel) renderArchive(); panel.classList.add('open'); btn.setAttribute('aria-expanded','true'); }
}
function close(){
  [infoPanel, archPanel].forEach(p => p.classList.remove('open'));
  [infoBtn, archBtn].forEach(b => b.setAttribute('aria-expanded','false'));
}
infoBtn.addEventListener('click', e => { e.stopPropagation(); toggle(infoBtn, infoPanel); });
archBtn.addEventListener('click', e => { e.stopPropagation(); toggle(archBtn, archPanel); });
[infoPanel, archPanel].forEach(p => p.addEventListener('click', e => e.stopPropagation()));
document.addEventListener('click', close);
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
viewer.addEventListener('load', close);

/* open the draft in the link (#1.7), otherwise the latest */
show(decodeURIComponent(location.hash.slice(1)) || live[0].v, false);
window.addEventListener('hashchange', () => show(decodeURIComponent(location.hash.slice(1)), false));
</script>
</body>
</html>
